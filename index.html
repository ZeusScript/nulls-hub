<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        .browser-bar {
            background-color: #121624;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .url-box {
            background-color: #1a1f30;
        }
        .btn-purple {
            background: linear-gradient(135deg, #8a75ff, #7353f7);
            box-shadow: 0 4px 20px rgba(115, 83, 247, 0.4);
        }
        .btn-outline {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

    <!-- MOBILE BROWSER CHROME (TOP) -->
    <div class="w-full browser-bar py-2 px-3 sticky top-0 z-50">
        <!-- Status Bar -->
        <div class="flex justify-between items-center text-xs text-slate-300 pb-2 px-1">
            <span class="font-medium">11:18</span>
            <div class="flex items-center space-x-2 text-slate-400">
                <!-- Status icons placeholders / emojis -->
                <span>📶</span>
                <span>🔋</span>
                <span class="text-white font-bold text-[10px]">78</span>
            </div>
        </div>

        <!-- URL & Navigation Bar -->
        <div class="flex items-center justify-between gap-2 px-1 py-1">
            <button class="text-slate-300 p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
            
            <div class="url-box flex-grow flex items-center justify-between px-4 py-2 rounded-full text-sm text-slate-200 border border-white/5 shadow-inner">
                <div class="flex items-center space-x-2 truncate">
                    <span class="text-slate-400 text-xs">🔒</span>
                    <span class="tracking-wide text-xs font-normal">deltaexploits.gg</span>
                </div>
                <div class="flex items-center space-x-3 text-slate-400">
                    <span class="text-xs">▶</span>
                    <span class="text-xs bg-slate-700/50 px-1.5 py-0.2 rounded text-slate-300 font-bold">36</span>
                </div>
            </div>

            <button class="text-slate-300 p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
            </button>
        </div>
    </div>

    <!-- MAIN WEBSITE CONTENT -->
    <main class="flex-grow flex flex-col justify-center px-6 py-8 max-w-md mx-auto w-full text-center">
        
        <!-- HEADER (LOGO & NAV) -->
        <header class="flex items-center justify-between w-full mb-12">
            <h1 class="text-2xl font-bold tracking-tight text-white">Delta</h1>
            <div class="flex items-center space-x-3">
                <a href="#" class="btn-outline px-4 py-1.5 rounded-xl text-xs font-medium text-slate-200">Download</a>
                <button class="text-white p-1 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- HERO SECTION -->
        <div class="space-y-4 mb-8">
            <p class="text-purple-400 font-bold text-[10px] tracking-widest uppercase">THE SKY IS THE LIMIT</p>
            <h2 class="text-4xl font-extrabold tracking-tight text-white leading-tight">
                Revolutionizing<br>the future of<br>execution
            </h2>
            <p class="text-slate-400 text-xs leading-relaxed max-w-[280px] mx-auto px-2">
                A premium experience embedded with the latest technologies to enhance your scripting experience to the next level.
            </p>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 w-full">
            <a href="#" class="btn-purple w-full py-3.5 rounded-xl font-semibold text-xs text-white text-center shadow-lg">Download</a>
            <a href="#" class="btn-outline w-full py-3.5 rounded-xl font-semibold text-xs text-white text-center flex items-center justify-center space-x-2">
                <span>Learn more</span>
                <span class="text-sm">→</span>
            </a>
        </div>

        <!-- CAROUSEL INDICATOR DOT -->
        <div class="flex justify-center mt-10">
            <div class="w-2 h-2 rounded-full bg-purple-500/60"></div>
        </div>

    </main>

    <!-- MOBILE NAVIGATION BAR (BOTTOM) -->
    <div class="w-full py-3 bg-[#080b13] border-t border-white/5 flex justify-around items-center text-slate-400 text-sm">
        <button class="p-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <button class="p-2">
            <div class="w-4 h-4 border-2 border-slate-400 rounded-sm"></div>
        </button>
        <button class="p-2">
            <svg class="w-5 h-5 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
    </div>

</body>
    </html>
